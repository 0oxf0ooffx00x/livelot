<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LiveLot Show Recap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/tokens.css" />
  <style>
    :root { color-scheme: light; }
    body { min-height: 100vh; display: grid; place-items: center; gap: 16px; padding: 24px 16px; background: #d9dde5; }
    .card { width: min(1200px, 100%); aspect-ratio: 16 / 9; background: #1c2547; color: #fff; border-radius: 18px; overflow: hidden; display: grid; grid-template-columns: 1.05fr 1fr; container-type: inline-size; }
    .left { padding: 5cqi 4.5cqi; display: grid; align-content: space-between; gap: 2cqi; }
    .shop { font-weight: 800; font-stretch: 80%; font-size: 2.2cqi; color: #e9c46a; }
    .head { font-weight: 900; font-stretch: 62%; font-size: 6.4cqi; line-height: .95; margin: 1cqi 0 0; }
    .nums { display: grid; grid-template-columns: repeat(3, auto); gap: 3cqi; justify-content: start; }
    .nums b { display: block; font-weight: 900; font-stretch: 62%; font-size: 5.6cqi; line-height: 1; }
    .nums span { font-size: 1.4cqi; color: #c5cbe0; }
    .quote { font-size: 1.75cqi; line-height: 1.45; color: #e6e9f4; max-width: 46ch; }
    .foot { font-size: 1.3cqi; color: #9ea6c6; display: flex; align-items: center; gap: .8cqi; }
    .foot svg { width: 2cqi; height: 2cqi; }
    .right { background: #e9c46a; padding: 3cqi; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 1.6cqi; }
    .it { position: relative; background: #fff center / cover no-repeat; border-radius: 1cqi; overflow: hidden; }
    .it .lbl { position: absolute; left: .8cqi; bottom: .8cqi; right: .8cqi; background: rgba(28,37,71,.85); color: #fff; border-radius: .6cqi; padding: .4cqi .8cqi; font-size: 1.25cqi; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .it.sold::after { content: 'SOLD'; position: absolute; top: 1.2cqi; right: 1cqi; transform: rotate(-12deg); color: #c7322b; border: .35cqi solid #c7322b; border-radius: .5cqi; padding: 0 .7cqi; font-weight: 900; font-stretch: 62%; font-size: 2.8cqi; background: rgba(255,255,255,.75); }
    .tools { display: flex; gap: 8px; }
    .tools button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 12px; font-weight: 650; cursor: pointer; }
    .src { color: var(--ink-3); font-size: 13px; }
  </style>
</head>
<body>
  <div class="card" id="card"><div class="left"><p>Loading the recap…</p></div></div>
  <div class="tools"><button id="copy">Copy post text</button><button id="again">Write it again</button></div>
  <p class="src" id="src"></p>
  <script type="module">
    import { esc, money, api } from '/shared/live.js';
    let data;
    async function load() {
      data = await api('/api/recap', null, 'GET');
      const st = await api('/api/state', null, 'GET');
      const sym = st.config.currencySymbol || '£';
      const s = data.stats;
      const secs = s.medianReplyMs ? (s.medianReplyMs / 1000).toFixed(1) : '–';
      const lots = data.lots.filter((l) => l.imagePath).slice(0, 4);
      document.getElementById('card').innerHTML = `<div class="left">
          <div><div class="shop">${esc(st.config.shopName || 'Our shop')}</div><h1 class="head">${s.paid} sold live.<br />Zero spreadsheets.</h1></div>
          <div class="nums"><div><b>${money(sym, s.revenue)}</b><span>paid during the show</span></div><div><b>${s.buyers}</b><span>buyers</span></div><div><b>${secs}s</b><span>from “sold” to pay link</span></div></div>
          <p class="quote">${esc(data.text)}</p>
          <div class="foot"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 6h17l9 10-9 10H3z" fill="#e9c46a"/><circle cx="20" cy="16" r="2.6" fill="#1c2547"/></svg>Sold on Facebook with LiveLot</div>
        </div>
        <div class="right">${lots.map((l) => `<div class="it ${l.status === 'sold_out' ? 'sold' : ''}" style="background-image:url('${esc(l.imagePath)}')"><span class="lbl">Lot ${l.lotNumber}: ${esc(l.title)}</span></div>`).join('')}</div>`;
      document.getElementById('src').textContent = `Post text written by ${data.source === 'template' ? 'the built-in template' : data.source}. Screenshot the card to share it.`;
    }
    document.getElementById('copy').onclick = () => navigator.clipboard.writeText(data?.text || '');
    document.getElementById('again').onclick = load;
    load();
  </script>
</body>
</html>
