# Copy to deploy/cloudrun.env.yaml (gitignored) and fill in. Used by scripts/deploy-cloudrun.sh.
ADMIN_TOKEN: "generate with: openssl rand -hex 24"
PUBLIC_BASE_URL: "https://livelot-xxxxxxxx.europe-west2.run.app"
DATA_DIR: "/tmp/livelot"
SHOP_NAME: "LiveLot Demo Shop"
# Real integrations (leave out to run in mock mode):
# MODEL_API_KEY: ""
# BASETEN_API_KEY: ""
# META_APP_SECRET: ""
# FB_PAGE_ID: ""
# FB_PAGE_TOKEN: ""
# IG_USER_ID: ""
# WOO_URL: ""
# WOO_CONSUMER_KEY: ""
# WOO_CONSUMER_SECRET: ""
# LIVELOT_PING_SECRET: ""
# Settings saved in the Settings screen (a Cloud Storage bucket mounted by scripts/deploy-cloudrun.sh)
SETTINGS_FILE: "/settings/settings.json"
